# Dipakai Coolify (Docker Compose) atau lokal: `docker compose up --build`.
# Database memakai server PostgreSQL yang sudah ada (DATABASE_URL), tidak ada container database.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Dipaksa ke volume permanen. Jangan isi NUXT_STORAGE_DIR di Coolify; nilai ./storage dari .env.example membuat upload hilang tiap deploy.
      NUXT_STORAGE_DIR: /data/storage
      NUXT_SESSION_SECRET: ${NUXT_SESSION_SECRET}
      NUXT_FILE_SECRET: ${NUXT_FILE_SECRET}
      NUXT_APP_URL: ${NUXT_APP_URL}
      NUXT_SMTP_HOST: ${NUXT_SMTP_HOST:-}
      NUXT_SMTP_PORT: ${NUXT_SMTP_PORT:-587}
      NUXT_SMTP_USER: ${NUXT_SMTP_USER:-}
      NUXT_SMTP_PASS: ${NUXT_SMTP_PASS:-}
      NUXT_SMTP_FROM: ${NUXT_SMTP_FROM:-OCN Project Hub <no-reply@example.com>}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    volumes:
      - storage:/data/storage
    ports:
      - "4044:4044"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4044/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
volumes:
  storage:
