@media (min-width:1024px) and (max-width:1279px){

.topbar{padding:10px 24px !important;flex-wrap:nowrap !important}
.tb-search{flex:1 1 auto !important;min-width:0 !important}

}
@media (max-width:767px){

.side .nav-link{justify-content:flex-start;padding:0 12px !important;width:auto}
.nav-backdrop{display:block}
.tb-menu{display:flex}
.topbar{padding:8px 12px !important;gap:8px !important;flex-wrap:nowrap !important;position:sticky;top:0;z-index:30}
.tb-search{flex:1 1 auto !important;min-width:0 !important}
.tb-help,.tb-sep,.tb-create{display:none !important}
.content{padding:16px !important}
h1{font-size:22px !important}

section[aria-label^="Ringkasan"] span[style*="font-size: 2"],section[aria-label="Angka utama"] span[style*="font-size: 2"],section[aria-label^="Statistik"] span[style*="font-size: 2"]{font-size:18px !important}
th,td{padding:10px 12px !important}
.item-row{grid-template-columns:64px minmax(0,1fr) 40px !important}
.item-row>:first-child{grid-column:1/-1}
.invoice-paper{padding:20px !important}
.subnav{flex:1 1 100% !important;flex-direction:row !important;overflow-x:auto}
.subnav button{white-space:nowrap;width:auto !important}
.login-hero{padding:28px 20px !important;gap:20px !important}
.login-hero ul{display:none !important}
.login-hero h1{font-size:24px !important}
}
</style>

<body>
<div id="app"></div>
<script>
DC.mount('#app', (function () {

class Component extends DCLogic {
  constructor(props) { super(props); this.state = Object.assign(this.fromTerm(this.projects()[1], 1), { tax: 0, sendOpen: false, note: 'Mohon cantumkan nomor invoice saat transfer. Terima kasih atas kepercayaan Anda.' }); }
  renderVals() {
    var self = this;
    var active = 'Payments.html';
    var __dc = this;
    var nav = [
      { label: 'Dashboard Investor', href: 'Main.html', icon: 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z' },
      { label: 'Proyek', href: 'Projects.html', icon: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z' },
      { label: 'Pembayaran', href: 'Payments.html', icon: 'M3 7h18v12H3zM3 7l2-3h12l2 3M16 13h2' },
      { label: 'Bug Tracker', href: 'Bugs.html', icon: 'M8 9h8v6a4 4 0 0 1-8 0zM12 9V6M9 5l1.5 2M15 5l-1.5 2M4 12h4M16 12h4M5 18l3-2M19 18l-3-2' },
      { label: 'Investor & Modal', href: 'Investors.html', icon: 'M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM22 19v-1a4 4 0 0 0-3-3.9M16 4.1a3 3 0 0 1 0 5.8' },
      { label: 'Laporan', href: 'Reports.html', icon: 'M6 3h9l4 4v14H6zM9 13h6M9 17h6M9 9h3' },
      { label: 'Pengaturan', href: 'Settings.html', icon: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12h2M3 12h2M12 3v2M12 19v2M17 7l1.5-1.5M5.5 18.5L7 17M17 17l1.5 1.5M5.5 5.5L7 7' }
    ].map(function (n) { return Object.assign({}, n, { active: n.href === active, idle: n.href !== active }); });
    var st = this.state;
    var rp = function (n) { return 'Rp ' + Math.round(n).toLocaleString('id-ID'); };
    var num = function (s) { return Number(String(s).replace(/\D/g, '')) || 0; };
    var MS = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    var projects = this.projects();
    var p = projects.filter(function (x) { return x.id === st.project; })[0];
    var term = p.terms[st.term] || p.terms[0];
    var due = term.due.split('-');
    var subtotal = st.items.reduce(function (a, it) { return a + (Number(it.qty) || 0) * (Number(it.price) || 0); }, 0);
    var discount = Math.min(st.discount, subtotal);
    var taxable = subtotal - discount;
    var taxAmt = taxable * (Number(st.tax) || 0) / 100;
    var setItem = function (i, field, parse) {
      return function (e) {
        var list = self.state.items.slice();
        var it = Object.assign({}, list[i]);
        it[field] = parse ? parse(e.target.value) : e.target.value;
        list[i] = it;
        self.setState({ items: list });
      };
    };
    return {
      nav: nav,
      navOpen: !!(__dc.state && __dc.state.navOpen),
      navClass: (__dc.state && __dc.state.navOpen) ? 'side open' : 'side',
      toggleNav: function () { __dc.setState({ navOpen: !(__dc.state && __dc.state.navOpen) }); },
      selProject: st.project,
      selTerm: String(st.term),
      projectOpts: projects.map(function (x) { return { label: x.name, value: x.id, desc: x.client }; }),
      onProject: function (val) {
        var np = self.projects().filter(function (x) { return x.id === val; })[0];
        var idx = np.terms.findIndex(function (t) { return !t.paid; });
        self.setState(self.fromTerm(np, idx < 0 ? 0 : idx));
      },
      termOpts: p.terms.map(function (t, i) { return { value: String(i), label: t.name + ' (' + t.pct + '%) — ' + rp(p.value * t.pct / 100), desc: t.paid ? 'Sudah lunas' : 'Jatuh tempo ' + t.due.split('-').reverse().join('/'), disabled: !!t.paid }; }),
      onTerm: function (val) { self.setState(self.fromTerm(p, Number(val))); },
      p: { name: p.name, client: p.client, contact: p.contact, valueRp: rp(p.value) },
      dueISO: term.due,
      dueText: Number(due[2]) + ' ' + MS[Number(due[1]) - 1] + ' ' + due[0],
      items: st.items.map(function (it, i) {
        var qty = Number(it.qty) || 0, price = Number(it.price) || 0;
        return {
          desc: it.desc, descShown: it.desc || '—', qty: qty, priceText: price ? price.toLocaleString('id-ID') : '',
          priceRp: rp(price), totalRp: rp(qty * price),
          onDesc: setItem(i, 'desc'), onQty: setItem(i, 'qty', function (v) { return Number(v) || 0; }), onPrice: setItem(i, 'price', num),
          remove: function () { var l = self.state.items.slice(); l.splice(i, 1); self.setState({ items: l }); }
        };
      }),
      addItem: function () { self.setState({ items: self.state.items.concat([{ desc: '', qty: 1, price: 0 }]) }); },
      discountText: st.discount ? st.discount.toLocaleString('id-ID') : '',
      onDiscount: function (e) { self.setState({ discount: num(e.target.value) }); },
      tax: st.tax,
      onTax: function (e) { self.setState({ tax: Number(e.target.value) || 0 }); },
      note: st.note,
      onNote: function (e) { self.setState({ note: e.target.value }); },
      subtotalRp: rp(subtotal),
      hasDiscount: discount > 0,
      discountRp: rp(discount),
      hasTax: Number(st.tax) > 0,
      taxRp: rp(taxAmt),
      totalRp: rp(taxable + taxAmt),
      sendOpen: !!st.sendOpen,
      openSend: function () { self.setState({ sendOpen: true }); },
      closeSend: function () { self.setState({ sendOpen: false }); }
    };
  }

  projects() {
    return [
      { id: 'bumdes', name: 'Sistem Informasi BUMDes', client: 'BUMDes [Nama Desa]', contact: '[Nama PIC klien]', value: 50000000, terms: [

      { id: 'pos', name: 'POS Resto', client: '54DM Cafe', contact: '[Nama pemilik cafe]', value: 18000000, terms: [
        { name: 'Tanda jadi', pct: 30, due: '2026-11-14', paid: true }, { name: 'Termin 1', pct: 40, due: '2026-12-10' }, { name: 'Pelunasan', pct: 30, due: '2026-12-20' }] },
      { id: 'lms', name: 'LMS Sekolah', client: 'Sekolah [Nama]', contact: '[Nama PIC sekolah]', value: 25000000, terms: [
        { name: 'DP', pct: 40, due: '2026-09-01', paid: true }, { name: 'Termin 2', pct: 30, due: '2026-12-01' }, { name: 'Pelunasan', pct: 30, due: '2027-01-15' }] }
    ];
  }

  fromTerm(p, idx) {
    var t = p.terms[idx];
    return {
      project: p.id, term: idx, discount: 0,
      items: [{ desc: t.name + ' ' + t.pct + '% — ' + p.name, qty: 1, price: p.value * t.pct / 100 }]
    };

  }
}

return Component;
})(), "<div class=\"shell\" style=\"display: flex; flex-wrap: wrap; min-height: 100vh; background: #F5F6F8\">\n  <aside :class=\"v.navClass\" aria-label=\"Navigasi\" style=\"flex: 1 1 232px; max-width: 100%; background: #0F1B2D; color: #D0D5DD; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px\">\n    <div style=\"display: flex; align-items: center; gap: 10px; padding: 0 8px\">\n      <div style=\"width: 36px; height: 36px; border-radius: 9px; background: #0B6E63; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; letter-spacing: 0.5px\">OCN<\/div>\n      <div class=\"brand-text\" style=\"display: flex; flex-direction: column; gap: 2px\">\n        <span style=\"color: #FFFFFF; font-weight: 700; font-size: 15px\">OCN Project Hub<\/span>\n        <span style=\"font-size: 12px; color: #98A2B3\">OCN Development<\/span>\n      <\/div>\n    <\/div>\n    <nav aria-label=\"Menu utama\" style=\"display: flex; flex-direction: column; gap: 4px\">\n      <template v-for=\"(n, $index) in v.nav\">\n        <template v-if=\"n.active\">\n          <a :href=\"n.href\" class=\"nav-link\" :aria-label=\"n.label\" :title=\"n.label\" aria-current=\"page\" style=\"display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; background: #1D2D46; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600\">\n            <svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5FD3C1\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path :d=\"n.icon\"><\/path><\/svg>\n            <span class=\"nav-label\">{{ n.label }}<\/span>\n          <\/a>\n        <\/template>\n        <template v-if=\"n.idle\">\n          <a :href=\"n.href\" class=\"nav-link\" :aria-label=\"n.label\" :title=\"n.label\" style=\"display: flex; align-items: center; gap: 12px; min-height: 44px; paddin
