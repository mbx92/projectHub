<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Komponen UI — OCN Project Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#101828;background:#F5F6F8}
a{color:#0B6E63}a:hover{color:#08544B}
table{border-collapse:collapse;width:100%}
th{font-size:12px;font-weight:600;color:#475467;text-align:left;padding:12px 16px;background:#F9FAFB;border-bottom:1px solid #E4E7EC;white-space:nowrap}
td{font-size:14px;padding:14px 16px;border-bottom:1px solid #EAECF0;vertical-align:middle;white-space:nowrap}
.day[aria-pressed="false"]:not(:disabled):hover,.tcell[aria-selected="false"]:hover,.opt[aria-selected="false"][aria-disabled="false"]:hover{background:#E6F4F1 !important}
.spin{animation:spin 0.8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
/* responsive:v3 */
.tb-menu{display:none}
.nav-backdrop{display:none}
@media (min-width:1024px) and (max-width:1279px){
section[aria-label^="Ringkasan"],section[aria-label="Angka utama"]{grid-template-columns:repeat(auto-fit,minmax(190px,1fr)) !important}
section[aria-label^="Ringkasan"] span[style*="font-size: 2"],section[aria-label="Angka utama"] span[style*="font-size: 2"]{font-size:20px !important}
}
@media (max-width:1023px){
.shell{flex-wrap:nowrap !important}
.side{flex:0 0 76px !important;width:76px;padding:20px 12px !important;align-items:center}
.brand-text,.nav-label{display:none !important}
.nav-link{justify-content:center;padding:0 !important;width:48px}
.content{padding:24px !important}
.topbar{padding:10px 24px !important;flex-wrap:nowrap !important}
.tb-search{flex:1 1 auto !important;min-width:0 !important}
.tb-kbd,.tb-user-text{display:none !important}
section[aria-label^="Ringkasan"],section[aria-label="Angka utama"]{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
[role="tablist"]{flex-wrap:nowrap !important;overflow-x:auto;scrollbar-width:none}
[role="tablist"]>*{flex:none}
}
@media (max-width:767px){
.shell{display:block !important}
.side{position:fixed !important;top:0;bottom:0;left:0;width:280px !important;max-width:85vw !important;z-index:60;transform:translateX(-105%);transition:transform .2s ease;overflow-y:auto;align-items:stretch;padding:24px 16px !important;box-sizing:border-box}
.side.open{transform:none;box-shadow:0 0 40px rgba(15,27,45,.35)}
.side .brand-text{display:flex !important}
.side .nav-label{display:inline !important}
.side .nav-link{justify-content:flex-start;padding:0 12px !important;width:auto}
.nav-backdrop{display:block}
.tb-menu{display:flex}
.topbar{padding:8px 12px !important;gap:8px !important;flex-wrap:nowrap !important;position:sticky;top:0;z-index:30}
.tb-search{flex:1 1 auto !important;min-width:0 !important}
.tb-help,.tb-sep,.tb-create{display:none !important}
.content{padding:16px !important}
h1{font-size:22px !important}
section[aria-label^="Ringkasan"],section[aria-label="Angka utama"],section[aria-label^="Statistik"]{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px !important}
section[aria-label^="Ringkasan"]>div,section[aria-label="Angka utama"]>div,section[aria-label^="Statistik"]>div{padding:14px !important;min-width:0}
section[aria-label^="Ringkasan"] span[style*="font-size: 2"],section[aria-label="Angka utama"] span[style*="font-size: 2"],section[aria-label^="Statistik"] span[style*="font-size: 2"]{font-size:18px !important}
th,td{padding:10px 12px !important}
.item-row{grid-template-columns:64px minmax(0,1fr) 40px !important}
.item-row>:first-child{grid-column:1/-1}
.invoice-paper{padding:20px !important}
.subnav{flex:1 1 100% !important;flex-direction:row !important;overflow-x:auto}
.subnav button{white-space:nowrap;width:auto !important}
.login-hero{padding:28px 20px !important;gap:20px !important}
.login-hero ul{display:none !important}
.login-hero h1{font-size:24px !important}
}
</style>
<script src="assets/vue.global.prod.js"></script>
<script src="assets/dc-runtime.js"></script>
<script src="assets/components.js"></script>
</head>
<body>
<div id="app"></div>
<script>
DC.mount('#app', (function () {

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'datetime', open: null, dtVal: { date: '2026-11-30', h: 14, m: 30 }, dtDraft: null, view: [2026, 10], status: 'berjalan', query: '', proyek: 1, dialog: null, typed: '', loading: false, err: '', log: 'Belum ada aksi' }; }
  renderVals() {
    var self = this;
    var active = 'Components.html';
    var __dc = this;
    var nav = [
      { label: 'Dashboard Investor', href: 'Main.html', icon: 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z' },
      { label: 'Proyek', href: 'Projects.html', icon: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z' },
      { label: 'Pembayaran', href: 'Payments.html', icon: 'M3 7h18v12H3zM3 7l2-3h12l2 3M16 13h2' },
      { label: 'Bug Tracker', href: 'Bugs.html', icon: 'M8 9h8v6a4 4 0 0 1-8 0zM12 9V6M9 5l1.5 2M15 5l-1.5 2M4 12h4M16 12h4M5 18l3-2M19 18l-3-2' },
      { label: 'Investor & Modal', href: 'Investors.html', icon: 'M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM22 19v-1a4 4 0 0 0-3-3.9M16 4.1a3 3 0 0 1 0 5.8' },
      { label: 'Laporan', href: 'Reports.html', icon: 'M6 3h9l4 4v14H6zM9 13h6M9 17h6M9 9h3' },
      { label: 'Pengaturan', href: 'Settings.html', icon: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12h2M3 12h2M12 3v2M12 19v2M17 7l1.5-1.5M5.5 18.5L7 17M17 17l1.5 1.5M5.5 5.5L7 7' }
    ].map(function (n) { return Object.assign({}, n, { active: n.href === active, idle: n.href !== active }); });
    var st = this.state;
    var MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    var MS = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    var pad = function (n) { return String(n).padStart(2, '0'); };
    var ymd = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
    var now = new Date();
    var today = ymd(now);
    var mode = st.mode;
    var hasDate = mode !== 'time';
    var hasTime = mode !== 'date';
    var set = function (patch) { return function () { self.setState(patch); }; };

    // ── Date & time ─────────────────────────────
    var val = st.dtVal;
    var draft = st.dtDraft || val;
    var dateText = function (s) { var p = s.split('-'); return Number(p[2]) + ' ' + MS[Number(p[1]) - 1] + ' ' + p[0]; };
    var timeText = pad(val.h) + '.' + pad(val.m);
    var dtDisplay = !val.date && mode !== 'time' ? (mode === 'date' ? 'Pilih tanggal' : 'Pilih tanggal & jam')
      : mode === 'date' ? dateText(val.date) : mode === 'time' ? timeText : dateText(val.date) + ', ' + timeText;
    var dtModel = !val.date && mode !== 'time' ? 'null'
      : mode === 'date' ? val.date : mode === 'time' ? pad(val.h) + ':' + pad(val.m) : val.date + 'T' + pad(val.h) + ':' + pad(val.m);
    var vy = st.view[0], vm = st.view[1];
    var first = new Date(vy, vm, 1);
    var start = new Date(vy, vm, 1 - (first.getDay() + 6) % 7);
    var days = [];
    for (var i = 0; i < 42; i++) {
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      var k = ymd(d);
      var sel = k === draft.date;
      var off = k < today;
      var inM = d.getMonth() === vm;
      days.push({
        day: d.getDate(), sel: sel, off: off, dot: k === today && !sel,
        aria: d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(),
        bg: sel ? '#0B6E63' : 'transparent',
        fg: sel ? '#FFFFFF' : off ? '#C4C9D1' : inM ? '#101828' : '#667085',
        fw: sel ? 700 : 400, deco: off ? 'line-through' : 'none', cursor: off ? 'not-allowed' : 'pointer',
        pick: (function (key) {
          return function () {
            var nd = Object.assign({}, draft, { date: key });
            if (mode === 'date') self.setState({ dtVal: nd, dtDraft: null, open: null });
            else self.setState({ dtDraft: nd });
          };
        })(k)
      });
    }
    var cell = function (label, on, pick) {
      return { label: label, sel: on, pick: pick, bg: on ? '#0B6E63' : 'transparent', fg: on ? '#FFFFFF' : '#101828', fw: on ? 700 : 400 };
    };
    var hours = [];
    for (var h = 0; h < 24; h++) hours.push(cell(pad(h), draft.h === h, (function (x) { return function () { self.setState({ dtDraft: Object.assign({}, draft, { h: x }) }); }; })(h)));
    var mins = [];
    for (var m = 0; m < 60; m += 5) mins.push(cell(pad(m), draft.m === m, (function (x) { return function () { self.setState({ dtDraft: Object.assign({}, draft, { m: x }) }); }; })(m)));
    var dtOpen = st.open === 'dt';

    // ── Select ──────────────────────────────────
    var statusDefs = [
      { v: 'persiapan', label: 'Persiapan', desc: 'Belum mulai dikerjakan', dot: '#B54708' },
      { v: 'berjalan', label: 'Berjalan', desc: 'Sedang dikerjakan tim', dot: '#175CD3' },
      { v: 'tertunda', label: 'Tertunda', desc: 'Menunggu klien', dot: '#B42318' },
      { v: 'selesai', label: 'Selesai', desc: 'Sudah serah terima', dot: '#0B6E63' },
      { v: 'arsip', label: 'Diarsipkan', desc: 'Hanya admin', dot: '#98A2B3', dis: true }
    ];
    var curStatus = statusDefs.filter(function (s) { return s.v === st.status; })[0];
    var selOpen = st.open === 'sel';
    var statusOpts = statusDefs.map(function (s) {
      var on = s.v === st.status;
      return {
        label: s.label, desc: s.desc, dot: s.dot, sel: on, dis: !!s.dis,
        bg: on ? '#E6F4F1' : 'transparent', fw: on ? 600 : 400,
        cursor: s.dis ? 'not-allowed' : 'pointer', op: s.dis ? 0.5 : 1,
        pick: s.dis ? function () {} : set({ status: s.v, open: null })
      };
    });

    // ── Search select ───────────────────────────
    var projects = [
      { v: 1, label: 'Sistem Informasi BUMDes', desc: 'BUMDes [Nama Desa] · 80%', g: 'Berjalan' },
      { v: 2, label: 'POS Resto', desc: '54DM Cafe · 25%', g: 'Berjalan' },
      { v: 3, label: 'LMS Sekolah', desc: '[Klien] · 45%', g: 'Berjalan' },
      { v: 4, label: 'Sistem Klinik Pratama', desc: '[Klien] · 10%', g: 'Persiapan' },
      { v: 5, label: 'Aplikasi Absensi Desa', desc: '[Klien] · 35%', g: 'Tertunda' },
      { v: 6, label: 'Website Company Profile', desc: '[Klien] · selesai', g: 'Selesai', dis: true }
    ];
    var q = (st.query || '').trim().toLowerCase();
    var hits = projects.filter(function (p) { return !q || (p.label + ' ' + p.desc).toLowerCase().indexOf(q) !== -1; });
    var parts = function (text) {
      if (!q) return [{ t: text, m: false, n: true }];
      var out = [], lower = text.toLowerCase(), from = 0, at = lower.indexOf(q);
      while (at !== -1) {
        if (at > from) out.push({ t: text.slice(from, at), m: false, n: true });
        out.push({ t: text.slice(at, at + q.length), m: true, n: false });
        from = at + q.length; at = lower.indexOf(q, from);
      }
      if (from < text.length) out.push({ t: text.slice(from), m: false, n: true });
      return out;
    };
    var ssRows = [];
    var lastG = null;
    hits.forEach(function (p) {
      if (p.g !== lastG) { ssRows.push({ isGroup: true, isOpt: false, label: p.g }); lastG = p.g; }
      var on = p.v === st.proyek;
      ssRows.push({
        isGroup: false, isOpt: true, label: p.label, desc: p.desc, parts: parts(p.label), sel: on, dis: !!p.dis,
        bg: on ? '#E6F4F1' : 'transparent', fw: on ? 600 : 400, cursor: p.dis ? 'not-allowed' : 'pointer', op: p.dis ? 0.5 : 1,
        pick: p.dis ? function () {} : set({ proyek: p.v, open: null, query: '' })
      });
    });
    var curProj = projects.filter(function (p) { return p.v === st.proyek; })[0];
    var ssOpen = st.open === 'ss';

    // ── Confirm dialog ──────────────────────────
    var V = {
      danger: { iconBg: '#FEE4E2', iconFg: '#B42318', btnBg: '#D92D20', path: 'M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3',
        title: 'Hapus proyek ini?', message: 'Semua termin, pengeluaran, dan bug di “Aplikasi Absensi Desa” ikut terhapus. Tindakan ini tidak bisa dibatalkan.', confirm: 'Hapus proyek', require: 'Aplikasi Absensi Desa', done: 'Proyek dihapus' },
      success: { iconBg: '#E6F4F1', iconFg: '#08544B', btnBg: '#0B6E63', path: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM8 12l3 3 5-6',
        title: 'Tandai termin sebagai lunas?', message: 'Pelunasan Rp 15.000.000 untuk Sistem Informasi BUMDes dicatat dan kuitansi dikirim ke klien.', confirm: 'Tandai lunas', async: 'ok', done: 'Termin ditandai lunas' },
      warning: { iconBg: '#FEF0C7', iconFg: '#B54708', btnBg: '#0B6E63', path: 'M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z',
        title: 'Kirim distribusi bagi hasil?', message: 'Dana bagi hasil POS Resto akan ditransfer ke investor dan pekerja.', confirm: 'Kirim', async: 'fail' },
      info: { iconBg: '#E8F0FE', iconFg: '#175CD3', btnBg: '#0B6E63', path: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 11v5M12 8h.01',
        title: 'Tutup BUG-041?', message: 'Bug dipindah ke kolom Selesai dan pelapor mendapat notifikasi.', confirm: 'Tutup bug', extra: 'Saldo jurnal umum tidak balance setelah retur penjualan', done: 'BUG-041 ditutup' }
    };
    var cur = st.dialog ? V[st.dialog] : V.info;
    var needType = !!cur.require && (st.typed || '').trim() !== cur.require;
    var blocked = st.loading || needType;
    var openDlg = function (k) { return function () { self.setState({ dialog: k, typed: '', loading: false, err: '' }); }; };

    return {
      nav: nav,
      navOpen: !!(__dc.state && __dc.state.navOpen),
      navClass: (__dc.state && __dc.state.navOpen) ? 'side open' : 'side',
      toggleNav: function () { __dc.setState({ navOpen: !(__dc.state && __dc.state.navOpen) }); },
      anyOpen: !!st.open,
      closeAll: set({ open: null, dtDraft: null }),
      tokens: [
        { name: 'brand-600', hex: '#0B6E63' }, { name: 'brand-700', hex: '#08544B' }, { name: 'brand-50', hex: '#E6F4F1' },
        { name: 'navy', hex: '#0F1B2D' }, { name: 'ink', hex: '#101828' }, { name: 'line', hex: '#D0D5DD' },
        { name: 'danger-600', hex: '#D92D20' }, { name: 'warning-700', hex: '#B54708' }, { name: 'info-700', hex: '#175CD3' }, { name: 'canvas', hex: '#F5F6F8' }
      ],
      modes: [['date', 'date'], ['datetime', 'datetime'], ['time', 'time']].map(function (x) {
        return { label: x[1], on: mode === x[0], off: mode !== x[0], pick: set({ mode: x[0], open: null, dtDraft: null }) };
      }),
      dtLabel: mode === 'time' ? 'Jam pengingat' : mode === 'date' ? 'Tanggal bayar' : 'Jatuh tempo',
      dtIcon: mode === 'time' ? 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2' : 'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4',
      dtDisplay: dtDisplay,
      dtModel: dtModel,
      dtOpen: dtOpen,
      dtBorder: dtOpen ? '#0B6E63' : '#D0D5DD',
      dtRing: dtOpen ? '0 0 0 4px #E6F4F1' : 'none',
      toggleDt: dtOpen ? set({ open: null, dtDraft: null }) : function () {
        var base = val.date ? val.date.split('-').map(Number) : [now.getFullYear(), now.getMonth() + 1];
        self.setState({ open: 'dt', dtDraft: Object.assign({}, val), view: [base[0], base[1] - 1] });
      },
      clearDt: set({ dtVal: { date: null, h: 9, m: 0 }, open: null, dtDraft: null }),
      applyDt: function () { self.setState({ dtVal: draft.date || mode === 'time' ? draft : val, open: null, dtDraft: null }); },
      setNow: function () {
        var nd = { date: today, h: now.getHours(), m: Math.floor(now.getMinutes() / 5) * 5 };
        if (mode === 'date') self.setState({ dtVal: Object.assign({}, val, { date: today }), open: null, dtDraft: null });
        else self.setState({ dtDraft: nd, view: [now.getFullYear(), now.getMonth()] });
      },
      nowLabel: mode === 'date' ? 'Hari ini' : 'Sekarang',
      hasDate: hasDate,
      hasTime: hasTime,
      timeBorder: hasDate ? '1px solid #E4E7EC' : 'none',
      timePad: hasDate ? '12px' : '0',
      monthLabel: MONTHS[vm] + ' ' + vy,
      prevMonth: function () { var d = new Date(vy, vm - 1, 1); self.setState({ view: [d.getFullYear(), d.getMonth()] }); },
      nextMonth: function () { var d = new Date(vy, vm + 1, 1); self.setState({ view: [d.getFullYear(), d.getMonth()] }); },
      weekdays: ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'],
      days: days,
      hours: hours,
      mins: mins,

      selOpen: selOpen,
      toggleSel: set({ open: selOpen ? null : 'sel' }),
      selBorder: selOpen ? '#0B6E63' : '#D0D5DD',
      selRing: selOpen ? '0 0 0 4px #E6F4F1' : 'none',
      selRot: selOpen ? 'rotate(180deg)' : 'none',
      selDot: curStatus.dot,
      selLabel: curStatus.label,
      status: st.status,
      statusOpts: statusOpts,

      ssOpen: ssOpen,
      toggleSs: set({ open: ssOpen ? null : 'ss', query: '' }),
      ssBorder: ssOpen ? '#0B6E63' : '#D0D5DD',
      ssRing: ssOpen ? '0 0 0 4px #E6F4F1' : 'none',
      ssLabel: curProj ? curProj.label : 'Pilih proyek…',
      ssColor: curProj ? '#101828' : '#667085',
      query: st.query,
      queryQuoted: q ? '“' + st.query.trim() + '”' : '',
      onQuery: function (e) { self.setState({ query: e.target.value }); },
      ssRows: ssRows,
      ssEmpty: hits.length === 0,
      proyek: st.proyek === null ? 'null' : st.proyek,

      openDanger: openDlg('danger'),
      openSuccess: openDlg('success'),
      openWarning: openDlg('warning'),
      openInfo: openDlg('info'),
      log: st.log,
      dlgOpen: !!st.dialog,
      typed: st.typed,
      onTyped: function (e) { self.setState({ typed: e.target.value }); },
      cancelDlg: function () { if (!self.state.loading) self.setState({ dialog: null, log: 'Dibatalkan' }); },
      confirmDlg: function () {
        if (blocked) return;
        if (cur.async) {
          self.setState({ loading: true, err: '' });
          setTimeout(function () {
            if (cur.async === 'fail') self.setState({ loading: false, err: 'Saldo kas OCN tidak cukup untuk distribusi ini.' });
            else self.setState({ loading: false, dialog: null, log: cur.done });
          }, 1200);
        } else {
          self.setState({ dialog: null, log: cur.done });
        }
      },
      dlg: {
        title: cur.title, message: cur.message, path: cur.path, iconBg: cur.iconBg, iconFg: cur.iconFg,
        hasExtra: !!cur.extra, extra: cur.extra || '',
        hasRequire: !!cur.require, require: cur.require || '',
        hasError: !!st.err, error: st.err,
        loading: !!st.loading, blocked: blocked,
        btnBg: cur.btnBg, btnOp: blocked && !st.loading ? 0.5 : 1, btnCursor: blocked ? 'not-allowed' : 'pointer',
        cancelOp: st.loading ? 0.5 : 1,
        btnLabel: st.loading ? 'Memproses…' : cur.confirm
      }
    };

  }
}

return Component;
