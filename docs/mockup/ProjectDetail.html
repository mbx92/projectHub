                  <template v-for=\"(b, $index) in v.bugs\">\n                    <tr>\n                      <td style=\"font-size: 13px; color: #475467; font-weight: 600\">{{ b.id }}<\/td>\n                      <td style=\"white-space: normal; min-width: 260px\"><a href=\"BugDetail.html\" style=\"font-weight: 600; color: #101828; text-decoration: none\">{{ b.title }}<\/a><\/td>\n                      <td><span style=\"font-size: 12px; color: #344054; background: #F2F4F7; padding: 2px 8px; border-radius: 6px\">{{ b.module }}<\/span><\/td>\n                      <td><span :style=\"'font-size: 12px; font-weight: 700; color: ' + (b.fg) + '; background: ' + (b.bg) + '; padding: 2px 8px; border-radius: 999px'\">{{ b.sev }}<\/span><\/td>\n                      <td>{{ b.col }}<\/td>\n                      <td>{{ b.who }}<\/td>\n                      <td style=\"color: #475467\">{{ b.date }}<\/td>\n                    <\/tr>\n                  <\/template>\n                <\/tbody>\n              <\/table>\n            <\/div>\n          <\/section>\n        <\/div>\n      <\/template>\n\n      <!-- ═══ TIM & BAGI HASIL ═══ -->\n      <template v-if=\"v.is.team\">\n        <div style=\"display: flex; flex-direction: column; gap: 16px\">\n          <section style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; overflow: hidden\">\n            <div style=\"padding: 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n              <h2 style=\"margin: 0; font-size: 16px; font-weight: 700\">Anggota Tim<\/h2>\n              <button type=\"button\" style=\"min-height: 36px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; background: #FFFFFF; color: #344054; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">+ Tambah Anggota<\/button>\n            <\/div>\n            <div style=\"overflow-x: auto\">\n              <table>\n                <thead><tr><th scope=\"col\">Nama<\/th><th scope=\"col\">Peran di Proyek<\/th><th scope=\"col\">Skema<\/th><th scope=\"col\">Tugas Selesai<\/th><th scope=\"col\">Bug Ditangani<\/th><\/tr><\/thead>\n                <tbody>\n                  <template v-for=\"(m, $index) in v.team\">\n                    <tr>\n                      <td><div style=\"display: flex; align-items: center; gap: 10px\"><span :style=\"'width: 32px; height: 32px; border-radius: 999px; background: ' + (m.bg) + '; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700'\">{{ m.ini }}<\/span><span style=\"font-weight: 600\">{{ m.name }}<\/span><\/div><\/td>\n                      <td>{{ m.role }}<\/td>\n                      <td><span :style=\"'font-size: 12px; font-weight: 600; color: ' + (m.sfg) + '; background: ' + (m.sbg) + '; padding: 2px 8px; border-radius: 999px'\">{{ m.scheme }}<\/span><\/td>\n                      <td>{{ m.tasks }}<\/td>\n                      <td>{{ m.bugs }}<\/td>\n                    <\/tr>\n                  <\/template>\n                <\/tbody>\n              <\/table>\n            <\/div>\n          <\/section>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start\">\n            <section style=\"flex: 1 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                <h2 style=\"margin: 0; font-size: 16px; font-weight: 700\">Simulasi Bagi Hasil<\/h2>\n                <span style=\"font-size: 13px; color: #475467\">Skema proyek ini: 50 : 50 antar pendiri (disepakati sebelum investor masuk)<\/span>\n              <\/div>\n              <div style=\"display: flex; flex-direction: column; gap: 10px; background: #F9FAFB; border-radius: 10px; padding: 16px\">\n                <div style=\"display: flex; justify-content: space-between; font-size: 14px\"><span style=\"color: #475467\">Total pembayaran klien<\/span><span style=\"font-weight: 600\">Rp 50.000.000<\/span><\/div>\n                <div style=\"display: flex; justify-content: space-between; font-size: 14px\"><span style=\"color: #475467\">Pengeluaran proyek (Freelancer dibayar dari sini)<\/span><span style=\"font-weight: 600\">− Rp 8.200.000<\/span><\/div>\n                <div style=\"height: 1px; background: #E4E7EC\"><\/div>\n                <div style=\"display: flex; justify-content: space-between; font-size: 15px\"><span style=\"font-weight: 700\">Laba bersih (estimasi)<\/span><span style=\"font-weight: 700\">Rp 41.800.000<\/span><\/div>\n              <\/div>\n              <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px\">\n                <div style=\"border: 1px solid #EAECF0; border-radius: 10px; padding: 14px; display: flex; align-items: center; gap: 12px\">\n                  <span style=\"width: 36px; height: 36px; border-radius: 999px; background: #0B6E63; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700\">PA<\/span>\n                  <div style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 13px; color: #475467\">Pande · 50%<\/span><span style=\"font-size: 16px; font-weight: 700\">Rp 20.900.000<\/span><\/div>\n                <\/div>\n                <div style=\"border: 1px solid #EAECF0; border-radius: 10px; padding: 14px; display: flex; align-items: center; gap: 12px\">\n                  <span style=\"width: 36px; height: 36px; border-radius: 999px; background: #1849A9; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700\">AG<\/span>\n                  <div style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 13px; color: #475467\">Angga · 50%<\/span><span style=\"font-size: 16px; font-weight: 700\">Rp 20.900.000<\/span><\/div>\n                <\/div>\n              <\/div>\n              <a href=\"Settings.html\" style=\"font-size: 13px; font-weight: 600; text-decoration: none\">Ubah skema di Pengaturan →<\/a>\n            <\/section>\n            <section style=\"flex: 1 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n              <h2 style=\"margin: 0; font-size: 16px; font-weight: 700\">Riwayat Pencairan<\/h2>\n              <template v-for=\"(d, $index) in v.payouts\">\n                <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #EAECF0\">\n                  <div style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; font-weight: 600\">{{ d.name }}<\/span><span style=\"font-size: 12px; color: #475467\">{{ d.meta }}<\/span><\/div>\n                  <span style=\"font-size: 14px; font-weight: 700\">{{ d.amount }}<\/span>\n                <\/div>\n              <\/template>\n              <span style=\"font-size: 12px; color: #475467\">Bagi hasil laba dicairkan setelah pelunasan diterima.<\/span>\n            <\/section>\n          <\/div>\n        <\/div>\n      <\/template>\n\n      <!-- ═══ DOKUMEN ═══ -->\n      <template v-if=\"v.is.docs\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start\">\n          <section style=\"flex: 2 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; overflow: hidden\">\n            <div style=\"padding: 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n              <h2 style=\"margin: 0; font-size: 16px; font-weight: 700\">Dokumen Proyek<\/h2>\n              <span style=\"font-size: 13px; color: #475467\">{{ v.docCount }} file<\/span>\n            <\/div>\n            <template v-for=\"(f, $index) in v.docs\">\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-top: 1px solid #EAECF0\">\n                <div style=\"display: flex; align-items: center; gap: 12px; min-width: 0\">\n                  <span :style=\"'width: 40px; height: 40px; border-radius: 8px; background: ' + (f.bg) + '; color: ' + (f.fg) + '; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex: none'\">{{ f.ext }}<\/span>\n                  <div style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0\">\n                    <span style=\"font-size: 14px; font-weight: 600\">{{ f.name }}<\/span>\n                    <span style=\"font-size: 12px; color: #475467\">{{ f.meta }}<\/span>\n                  <\/div>\n                <\/div>\n                <div style=\"display: flex; align-items: center; gap: 12px\">\n                  <span :style=\"'font-size: 12px; font-weight: 600; color: ' + (f.sfg) + '; background: ' + (f.sbg) + '; padding: 2px 8px; border-radius: 999px; white-space: nowrap'\">{{ f.status }}<\/span>\n                  <a href=\"#\" style=\"font-size: 13px; font-weight: 600; text-decoration: none; min-height: 44px; display: flex; align-items: center\">Unduh<\/a>\n                <\/div>\n              <\/div>\n            <\/template>\n          <\/section>\n          <div style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n            <section style=\"background: #FFFFFF; border: 2px dashed #D0D5DD; border-radius: 12px; padding: 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center\">\n              <span style=\"width: 44px; height: 44px; border-radius: 999px; background: #E6F4F1; display: flex; align-items: center; justify-content: center\">\n                <svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0B6E63\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3\"><\/path><\/svg>\n              <\/span>\n              <span style=\"font-size: 14px; font-weight: 600\">Tarik file ke sini<\/span>\n              <span style=\"font-size: 12px; color: #475467\">PDF, DOCX, XLSX, gambar · maks 20 MB<\/span>\n              <button type=\"button\" style=\"min-height: 40px; padding: 0 14px; border: 1px solid #D0D5DD; border-radius: 8px; background: #FFFFFF; color: #344054; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">Pilih file<\/button>\n            <\/section>\n            <section style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n              <h2 style=\"margin: 0; font-size: 16px; font-weight: 700\">Dokumen Wajib<\/h2>\n              <template v-for=\"(c, $index) in v.checklist\">\n                <div style=\"display: flex; align-items: center; gap: 10px; font-size: 14px\">\n                  <span :style=\"'width: 20px; height: 20px; border-radius: 999px; background: ' + (c.bg) + '; display: flex; align-items: center; justify-content: center; flex: none'\">\n                    <template v-if=\"c.done\"><svg aria-hidden=\"true\" width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"><\/path><\/svg><\/template>\n                  <\/span>\n                  <span :style=\"'color: ' + (c.fg)\">{{ c.label }}<\/span>\n                <\/div>\n              <\/template>\n            <\/section>\n          <\/div>\n        <\/div>\n      <\/template>\n\n    <\/div>\n    <\/div>\n  <\/main>\n<\/div>");
