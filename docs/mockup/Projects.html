@media (min-width:1024px) and (max-width:1279px){

[role="tablist"]{flex-wrap:nowrap !important;overflow-x:auto;scrollbar-width:none}
[role="tablist"]>*{flex:none}
}
@media (max-width:767px){
.shell{display:block !important}
.side{position:fixed !important;top:0;bottom:0;left:0;width:280px !important;max-width:85vw !important;z-index:60;transform:translateX(-105%);transition:transform .2s ease;overflow-y:auto;align-items:stretch;padding:24px 16px !important;box-sizing:border-box}
.side.open{transform:none;box-shadow:0 0 40px rgba(15,27,45,.35)}
.side .brand-text{display:flex !important}
.side .nav-label{display:inline !important}
.side .nav-link{justify-content:flex-start;padding:0 12px !important;width:auto}
.nav-backdrop{display:block}
.tb-menu{display:flex}
.topbar{padding:8px 12px !important;gap:8px !important;flex-wrap:nowrap !important;position:sticky;top:0;z-index:30}
.tb-search{flex:1 1 auto !important;min-width:0 !important}
.tb-help,.tb-sep,.tb-create{display:none !important}
.content{padding:16px !important}
h1{font-size:22px !important}
section[aria-label^="Ringkasan"],section[aria-label="Angka utama"],section[aria-label^="Statistik"]{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px !important}
section[aria-label^="Ringkasan"]>div,section[aria-label="Angka utama"]>div,section[aria-label^="Statistik"]>div{padding:14px !important;min-width:0}
section[aria-label^="Ringkasan"] span[style*="font-size: 2"],section[aria-label="Angka utama"] span[style*="font-size: 2"],section[aria-label^="Statistik"] span[style*="font-size: 2"]{font-size:18px !important}
th,td{padding:10px 12px !important}
.item-row{grid-template-columns:64px minmax(0,1fr) 40px !important}
.item-row>:first-child{grid-column:1/-1}
.invoice-paper{padding:20px !important}
.subnav{flex:1 1 100% !important;flex-direction:row !important;overflow-x:auto}
.subnav button{white-space:nowrap;width:auto !important}
.login-hero{padding:28px 20px !important;gap:20px !important}
.login-hero ul{display:none !important}
.login-hero h1{font-size:24px !important}
}
</style>

-items: flex-end; justify-content: space-between; gap: 16px\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px\">\n          <h1 style=\"margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.4px\">Proyek<\/h1>\n          <p style=\"margin: 0; font-size: 14px; color: #475467\">Kelola proyek, termin pembayaran klien, dan bug dalam satu tempat.<\/p>\n        <\/div>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n          <button type=\"button\" style=\"min-height: 44px; padding: 0 16px; border: 1px solid #D0D5DD; border-radius: 8px; background: #FFFFFF; color: #344054; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer\">Impor dari Excel<\/button>\n          <a href=\"ProjectForm.html\" style=\"min-height: 44px; padding: 0 18px; border-radius: 8px; background: #0B6E63; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center\">+ Proyek Baru<\/a>\n        <\/div>\n      <\/header>\n\n      <section aria-label=\"Ringkasan proyek\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px\">\n        <div style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 6px\">\n          <span style=\"font-size: 13px; color: #475467; font-weight: 500\">Proyek berjalan<\/span>\n          <span style=\"font-size: 24px; font-weight: 700\">4 <span style=\"font-size: 13px; color: #475467; font-weight: 500\">dari 6<\/span><\/span>\n        <\/div>\n        <div style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 6px\">\n          <span style=\"font-size: 13px; color: #475467; font-weight: 500\">Piutang klien<\/span>\n          <span style=\"font-size: 24px; font-weight: 700\">Rp 72.350.000<\/span>\n        <\/div>\n        <div style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 6px\">\n          <span style=\"font-size: 13px; color: #475467; font-weight: 500\">Jatuh tempo 14 hari<\/span>\n          <span style=\"font-size: 24px; font-weight: 700; color: #B54708\">2 termin<\/span>\n        <\/div>\n        <div style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 6px\">\n          <span style=\"font-size: 13px; color: #475467; font-weight: 500\">Bug kritis terbuka<\/span>\n          <span style=\"font-size: 24px; font-weight: 700; color: #B42318\">2<\/span>\n        <\/div>\n      <\/section>\n\n      <div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start\">\n        <section style=\"flex: 3 1 640px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; overflow: hidden\">\n          <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #EAECF0\">\n            <div role=\"tablist\" aria-label=\"Filter status\" style=\"display: flex; flex-wrap: wrap; gap: 4px; background: #F2F4F7; padding: 4px; border-radius: 10px\">\n              <template v-for=\"(t, $index) in v.tabs\">\n                <template v-if=\"t.on\">\n                  <button type=\"button\" role=\"tab\" aria-selected=\"true\" @click=\"t.pick\" style=\"min-height: 36px; padding: 0 14px; border: none; border-radius: 8px; background: #FFFFFF; color: #101828; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 1px 2px rgba(16,24,40,0.08)\">{{ t.label }} · {{ t.count }}<\/button>\n                <\/template>\n                <template v-if=\"t.off\">\n                  <button type=\"button\" role=\"tab\" aria-selected=\"false\" @click=\"t.pick\" style=\"min-height: 36px; padding: 0 14px; border: none; border-radius: 8px; background: transparent; color: #475467; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer\">{{ t.label }} · {{ t.count }}<\/button>\n                <\/template>\n              <\/template>\n            <\/div>\n            <label style=\"display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; background: #FFFFFF; flex: 0 1 260px\">\n              <svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#475467\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"M20 20l-4-4\"><\/path><\/svg>\n              <span style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Cari proyek<\/span>\n              <input type=\"search\" placeholder=\"Cari proyek atau klien\" style=\"border: none; outline: none; font: inherit; font-size: 14px; width: 100%; background: transparent; color: #101828\">\n            <\/label>\n          <\/div>\n          <div style=\"overflow-x: auto\">\n            <table>\n              <thead>\n                <tr><th scope=\"col\">Proyek / Klien<\/th><th scope=\"col\">Tim<\/th><th scope=\"col\">Progress<\/th><th scope=\"col\">Pembayaran<\/th><th scope=\"col\">Bug<\/th><th scope=\"col\">Tenggat<\/th><th scope=\"col\">Status<\/th><\/tr>\n              <\/thead>\n              <tbody>\n                <template v-for=\"(p, $index) in v.rows\">\n                  <tr>\n                    <td>\n                      <div style=\"display: flex; flex-direction: column; gap: 2px\">\n                        <a href=\"ProjectDetail.html\" style=\"font-weight: 600; color: #101828; text-decoration: none\">{{ p.name }}<\/a>\n                        <span style=\"font-size: 12px; color: #475467\">{{ p.client }}<\/span>\n                      <\/div>\n                    <\/td>\n                    <td>\n                      <div style=\"display: flex\">\n                        <template v-for=\"(m, $index) in p.team\">\n                          <span :title=\"m.name\" :style=\"'width: 30px; height: 30px; border-radius: 999px; background: ' + (m.bg) + '; color: #FFFFFF; border: 2px solid #FFFFFF; margin-right: -6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700'\">{{ m.ini }}<\/span>\n                        <\/template>\n                      <\/div>\n                    <\/td>\n                    <td>\n                      <div style=\"display: flex; align-items: center; gap: 8px\">\n                        <div style=\"width: 80px; height: 8px; border-radius: 999px; background: #EAECF0; overflow: hidden\"><div :style=\"'width: ' + (p.progress) + '%; height: 100%; background: #0B6E63'\"><\/div><\/div>\n                        <span style=\"font-size: 13px; font-weight: 600\">{{ p.progress }}%<\/span>\n                      <\/div>\n                    <\/td>\n                    <td>\n                      <div style=\"display: flex; flex-direction: column; gap: 2px\">\n                        <span style=\"font-weight: 600\">{{ p.paid }}<\/span>\n                        <span style=\"font-size: 12px; color: #475467\">dari {{ p.value }}<\/span>\n                      <\/div>\n                    <\/td>\n                    <td><a href=\"Bugs.html\" style=\"text-decoration: none; font-weight: 600\">{{ p.bugs }}<\/a><\/td>\n                    <td style=\"color: #344054\">{{ p.due }}<\/td>\n                    <td><span :style=\"'font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; color: ' + (p.fg) + '; background: ' + (p.bg)\">{{ p.status }}<\/span><\/td>\n                  <\/tr>\n                <\/template>\n              <\/tbody>\n            <\/table>\n          <\/div>\n        <\/section>\n\n        <aside aria-label=\"Pembayaran jatuh tempo\" style=\"flex: 1 1 300px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n          <h2 style=\"margin: 0; font-size: 16px; font-weight: 700\">Termin Jatuh Tempo<\/h2>\n          <template v-for=\"(d, $index) in v.dues\">\n            <div style=\"border: 1px solid #EAECF0; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px\">\n              <div style=\"display: flex; justify-content: space-between; gap: 8px\">\n                <span style=\"font-size: 14px; font-weight: 600\">{{ d.project }}<\/span>\n                <span :style=\"'font-size: 12px; font-weight: 600; color: ' + (d.fg) + '; background: ' + (d.bg) + '; padding: 2px 8px; border-radius: 999px; white-space: nowrap'\">{{ d.when }}<\/span>\n              <\/div>\n              <span style=\"font-size: 13px; color: #475467\">{{ d.term }} · jatuh tempo {{ d.date }}<\/span>\n              <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px\">\n                <span style=\"font-size: 16px; font-weight: 700\">{{ d.amount }}<\/span>\n                <a href=\"ProjectDetail.html\" style=\"font-size: 13px; font-weight: 600; text-decoration: none; min-height: 44px; display: flex; align-items: center\">Kirim pengingat<\/a>\n              <\/div>\n            <\/div>\n          <\/template>\n        <\/aside>\n      <\/div>\n\n    <\/div>\n    <\/div>\n  <\/main>\n<\/div>");
</script>
