desc }}<\/span>\n                  <\/button>\n                <\/template>\n                <template v-if=\"t.off\">\n                  <button type=\"button\" role=\"radio\" aria-checked=\"false\" @click=\"t.pick\" style=\"text-align: left; border: 1px solid #D0D5DD; border-radius: 10px; padding: 15px; background: #FFFFFF; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px\">\n                    <span style=\"font-size: 14px; font-weight: 600; color: #101828\">{{ t.name }}<\/span>\n                    <span style=\"font-size: 12px; color: #475467\">{{ t.desc }}<\/span>\n                  <\/button>\n                <\/template>\n              <\/template>\n            <\/div>\n\n            <div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n              <div style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 18px\">\n                <template v-for=\"(s, $index) in v.sliders\">\n                  <label style=\"display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600; color: #344054\">\n                    <span style=\"display: flex; justify-content: space-between\"><span>{{ s.label }}<\/span><span style=\"color: #101828\">{{ s.value }}%<\/span><\/span>\n                    <input type=\"range\" min=\"0\" max=\"100\" step=\"5\" :value=\"s.value\" @change=\"s.change\" style=\"width: 100%; accent-color: #0B6E63; min-height: 24px\">\n                  <\/label>\n                <\/template>\n                <div style=\"display: flex; justify-content: space-between; font-size: 14px; padding: 12px 14px; border-radius: 8px; background: #F2F4F7\">\n                  <span style=\"font-weight: 600; color: #344054\">Kas OCN (sisa otomatis)<\/span><span style=\"font-weight: 700\">{{ v.kas }}%<\/span>\n                <\/div>\n                <template v-if=\"v.over\">\n                  <span role=\"alert\" style=\"font-size: 13px; color: #B42318; font-weight: 600\">Total melebihi 100% — kurangi salah satu bagian.<\/span>\n                <\/template>\n              <\/div>\n\n              <div style=\"flex: 1 1 280px; min-width: 0; background: #F9FAFB; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px\">\n                <span style=\"font-size: 13px; color: #475467\">Simulasi dengan laba bersih <strong style=\"color: #101828\">Rp 10.000.000<\/strong><\/span>\n                <div style=\"display: flex; height: 14px; border-radius: 999px; overflow: hidden; gap: 2px\">\n                  <div :style=\"'width: ' + (v.modalPct) + '%; background: #0B6E63'\"><\/div>\n                  <div :style=\"'width: ' + (v.workPct) + '%; background: #2E90FA'\"><\/div>\n                  <div :style=\"'width: ' + (v.kasPct) + '%; background: #98A2B3'\"><\/div>\n                <\/div>\n                <div style=\"display: flex; justify-content: space-between; font-size: 14px\"><span style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 10px; height: 10px; border-radius: 3px; background: #0B6E63\"><\/span>{{ v.modalLabel }}<\/span><span style=\"font-weight: 700\">{{ v.modalRp }}<\/span><\/div>\n                <div style=\"display: flex; justify-content: space-between; font-size: 14px\"><span style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 10px; height: 10px; border-radius: 3px; background: #2E90FA\"><\/span>{{ v.workLabel }}<\/span><span style=\"font-weight: 700\">{{ v.workRp }}<\/span><\/div>\n                <div style=\"display: flex; justify-content: space-between; font-size: 14px\"><span style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 10px; height: 10px; border-radius: 3px; background: #98A2B3\"><\/span>Kas OCN<\/span><span style=\"font-weight: 700\">{{ v.kasRp }}<\/span><\/div>\n                <span style=\"font-size: 12px; color: #475467\">Bagian modal dibagi lagi antar investor sesuai porsi modal masing-masing.<\/span>\n              <\/div>\n            <\/div>\n\n            <div style=\"display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid #EAECF0; padding-top: 16px\">\n              <button type=\"button\" style=\"min-height: 44px; padding: 0 16px; border: 1px solid #D0D5DD; border-radius: 8px; background: #FFFFFF; color: #344054; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer\">Batalkan<\/button>\n              <button type=\"button\" style=\"min-height: 44px; padding: 0 18px; border: none; border-radius: 8px; background: #0B6E63; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer\">Simpan Template<\/button>\n            <\/div>\n          <\/section>\n\n          <\/template>\n\n          <template v-if=\"v.is.users\">\n          <section style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; overflow: hidden\">\n            <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 20px 24px\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                <h2 style=\"margin: 0; font-size: 18px; font-weight: 700\">Pengguna &amp; Hak Akses<\/h2>\n                <span style=\"font-size: 13px; color: #475467\">Investor hanya bisa melihat; freelancer hanya melihat proyek dan bug yang ditugaskan.<\/span>\n              <\/div>\n              <button type=\"button\" style=\"min-height: 44px; padding: 0 16px; border: 1px solid #D0D5DD; border-radius: 8px; background: #FFFFFF; color: #344054; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer\">+ Tambah Pengguna<\/button>\n            <\/div>\n            <div style=\"overflow-x: auto\">\n              <table>\n                <thead><tr><th scope=\"col\">Pengguna<\/th><th scope=\"col\">Peran<\/th><th scope=\"col\">Proyek<\/th><th scope=\"col\">Keuangan<\/th><th scope=\"col\">Bug<\/th><th scope=\"col\">Investor<\/th><\/tr><\/thead>\n                <tbody>\n                  <template v-for=\"(u, $index) in v.users\">\n                    <tr>\n                      <td>\n                        <div style=\"display: flex; align-items: center; gap: 10px\">\n                          <span :style=\"'width: 32px; height: 32px; border-radius: 999px; background: ' + (u.bg) + '; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700'\">{{ u.ini }}<\/span>\n                          <span style=\"font-weight: 600\">{{ u.name }}<\/span>\n                        <\/div>\n                      <\/td>\n                      <td><span style=\"font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; color: #344054; background: #F2F4F7\">{{ u.role }}<\/span><\/td>\n                      <td>{{ u.p }}<\/td><td>{{ u.k }}<\/td><td>{{ u.b }}<\/td><td>{{ u.i }}<\/td>\n                    <\/tr>\n                  <\/template>\n                <\/tbody>\n              <\/table>\n            <\/div>\n          <\/section>\n          <\/template>\n\n          <template v-if=\"v.is.profile\">\n            <section style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 20px\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                <h2 style=\"margin: 0; font-size: 18px; font-weight: 700\">Profil Usaha<\/h2>\n                <span style=\"font-size: 13px; color: #475467\">Dipakai di kop invoice, kuitansi, dan laporan investor.<\/span>\n              <\/div>\n              <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 16px\">\n                <div style=\"width: 72px; height: 72px; border-radius: 16px; background: #0B6E63; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px\">OCN<\/div>\n                <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                  <div style=\"display: flex; gap: 8px\">\n                    <button type=\"button\" style=\"min-height: 40px; padding: 0 14px; border: 1px solid #D0D5DD; border-radius: 8px; background: #FFFFFF; color: #344054; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">Ganti logo<\/button>\n                    <button type=\"button\" style=\"min-height: 40px; padding: 0 14px; border: none; border-radius: 8px; background: transparent; color: #B42318; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">Hapus<\/button>\n                  <\/div>\n                  <span style=\"font-size: 12px; color: #475467\">PNG atau SVG, persegi, minimal 256×256 px<\/span>\n                <\/div>\n              <\/div>\n              <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px\">\n                <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #344054\">Nama usaha\n                  <input type=\"text\" value=\"OCN Development\" style=\"min-height: 44px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-weight: 400; font-size: 14px; box-sizing: border-box\">\n                <\/label>\n                <ui-select label=\"Bentuk usaha\" options=\"Perorangan / UMKM|CV|PT\" value=\"Perorangan / UMKM\" />\n                <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #344054\">NPWP\n                  <input type=\"text\" placeholder=\"[Nomor NPWP]\" style=\"min-height: 44px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-weight: 400; font-size: 14px; box-sizing: border-box\">\n                <\/label>\n                <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #344054\">Email usaha\n                  <input type=\"email\" placeholder=\"[email@domain]\" style=\"min-height: 44px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-weight: 400; font-size: 14px; box-sizing: border-box\">\n                <\/label>\n                <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #344054\">WhatsApp\n                  <input type=\"tel\" placeholder=\"[+62 …]\" style=\"min-height: 44px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-weight: 400; font-size: 14px; box-sizing: border-box\">\n                <\/label>\n                <ui-select label=\"Zona waktu\" options=\"WITA (UTC+8) — Bali|WIB (UTC+7)|WIT (UTC+9)\" value=\"WITA (UTC+8) — Bali\" />\n              <\/div>\n              <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #344054\">Alamat\n                <textarea rows=\"3\" placeholder=\"[Alamat usaha], Bali\" style=\"padding: 12px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-weight: 400; font-size: 14px; resize: vertical; box-sizing: border-box\"><\/textarea>\n              <\/label>\n              <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px\">\n                <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #344054\">Format nomor invoice\n                  <input type=\"text\" value=\"INV-[TAHUN]-[NOMOR 3 DIGIT]\" style=\"min-height: 44px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-weight: 400; font-size: 14px; box-sizing: border-box\">\n                  <span style=\"font-size: 12px; font-weight: 400; color: #475467\">Contoh: INV-2026-015<\/span>\n                <\/label>\n                <ui-select label=\"Mata uang\" options=\"Rupiah (IDR)\" value=\"Rupiah (IDR)\" />\n              <\/div>\n              <div style=\"display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid #EAECF0; padding-top: 16px\">\n                <button type=\"button\" style=\"min-height: 44px; padding: 0 18px; border: none; border-radius: 8px; background: #0B6E63; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer\">Simpan Perubahan<\/button>\n              <\/div>\n            <\/section>\n          <\/template>\n\n          <template v-if=\"v.is.bank\">\n            <div style=\"display: flex; flex-direction: column; gap: 20px\">\n              <section style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px\">\n                <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start\">\n                  <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                    <h2 style=\"margin: 0; font-size: 18px; font-weight: 700\">Rekening Penerimaan<\/h2>\n                    <span style=\"font-size: 13px; color: #475467\">Rekening utama tercetak di invoice dan pengingat pembayaran.<\/span>\n                  <\/div>\n                  <button type=\"button\" style=\"min-height: 44px; padding: 0 16px; border: 1px solid #D0D5DD; border-radius: 8px; background: #FFFFFF; color: #344054; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer\">+ Tambah Rekening<\/button>\n                <\/div>\n                <template v-for=\"(a, $index) in v.accounts\">\n                  <div :style=\"'display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid ' + (a.border) + '; background: ' + (a.bg) + '; border-radius: 10px; padding: 16px'\">\n                    <div style=\"display: flex; align-items: center; gap: 12px\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E4E7EC; display: flex; align-items: center; justify-content: center\">\n                        <svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#344054\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18\"><\/path><\/svg>\n                      <\/span>\n                      <div style=\"display: flex; flex-direction: column; gap: 2px\">\n                        <span style=\"font-size: 14px; font-weight: 600\">{{ a.bank }}<\/span>\n                        <span style=\"font-size: 13px; color: #475467\">{{ a.number }} · a.n. {{ a.owner }}<\/span>\n                      <\/div>\n                    <\/div>\n                    <div style=\"display: flex; align-items: center; gap: 10px\">\n                      <template v-if=\"a.primary\"><span style=\"font-size: 12px; font-weight: 600; color: #08544B; background: #FFFFFF; border: 1px solid #CCE9E3; padding: 2px 8px; border-radius: 999px\">Utama<\/span><\/template>\n                      <button type=\"button\" style=\"min-height: 36px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; background: #FFFFFF; color: #344054; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">Ubah<\/button>\n                    <\/div>\n                  <\/div>\n                <\/template>\n              <\/section>\n              <section style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px\">\n                <h2 style=\"margin: 0; font-size: 18px; font-weight: 700\">Metode Pembayaran &amp; Invoice<\/h2>\n                <template v-for=\"(m, $index) in v.methods\">\n                  <label style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; border-bottom: 1px solid #EAECF0\">\n                    <span style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; font-weight: 600\">{{ m.name }}<\/span><span style=\"font-size: 12px; color: #475467\">{{ m.desc }}<\/span><\/span>\n                    <input type=\"checkbox\" :checked=\"m.on\" style=\"width: 20px; height: 20px; accent-color: #0B6E63\">\n                  <\/label>\n                <\/template>\n                <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; padding-top: 4px\">\n                  <ui-select label=\"Jatuh tempo default\" options=\"14 hari setelah invoice|7 hari|30 hari\" value=\"14 hari setelah invoice\" />\n                  <ui-select label=\"Pajak di invoice\" options=\"Tidak ditampilkan|Tampilkan PPN\" value=\"Tidak ditampilkan\" />\n                <\/div>\n                <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #344054\">Catatan kaki invoice\n                  <textarea rows=\"2\" style=\"padding: 12px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-weight: 400; font-size: 14px; resize: vertical; box-sizing: border-box\">Terima kasih atas kepercayaan Anda. Mohon cantumkan nomor invoice saat transfer.<\/textarea>\n                <\/label>\n              <\/section>\n            <\/div>\n          <\/template>\n\n          <template v-if=\"v.is.notif\">\n            <section style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px\">\n              <div style=\"padding: 24px 24px 16px; display: flex; flex-direction: column; gap: 4px\">\n                <h2 style=\"margin: 0; font-size: 18px; font-weight: 700\">Notifikasi<\/h2>\n                <span style=\"font-size: 13px; color: #475467\">Pilih kejadian dan saluran pemberitahuan untuk akun Anda.<\/span>\n              <\/div>\n              <div style=\"overflow-x: auto\">\n                <table>\n                  <thead><tr><th scope=\"col\">Kejadian<\/th><th scope=\"col\" style=\"text-align: center\">Di aplikasi<\/th><th scope=\"col\" style=\"text-align: center\">Email<\/th><th scope=\"col\" style=\"text-align: center\">WhatsApp<\/th><\/tr><\/thead>\n                  <tbody>\n                    <template v-for=\"(n, $index) in v.notifs\">\n                      <tr>\n                        <td style=\"white-space: normal\"><div style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-weight: 600\">{{ n.name }}<\/span><span style=\"font-size: 12px; color: #475467\">{{ n.desc }}<\/span><\/div><\/td>\n                        <td style=\"text-align: center\"><input type=\"checkbox\" :aria-label=\"(n.name) + ' di aplikasi'\" :checked=\"n.app\" style=\"width: 20px; height: 20px; accent-color: #0B6E63\"><\/td>\n                        <td style=\"text-align: center\"><input type=\"checkbox\" :aria-label=\"(n.name) + ' lewat email'\" :checked=\"n.email\" style=\"width: 20px; height: 20px; accent-color: #0B6E63\"><\/td>\n                        <td style=\"text-align: center\"><input type=\"checkbox\" :aria-label=\"(n.name) + ' lewat WhatsApp'\" :checked=\"n.wa\" style=\"width: 20px; height: 20px; accent-color: #0B6E63\"><\/td>\n                      <\/tr>\n                    <\/template>\n                  <\/tbody>\n                <\/table>\n              <\/div>\n              <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 24px\">\n                <div style=\"width: 220px\"><ui-select label=\"Ringkasan harian dikirim jam\" options=\"08.00 WITA|17.00 WITA|Nonaktif\" value=\"08.00 WITA\" /><\/div>\n                <button type=\"button\" style=\"min-height: 44px; padding: 0 18px; border: none; border-radius: 8px; background: #0B6E63; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer\">Simpan<\/button>\n              <\/div>\n            <\/section>\n          <\/template>\n\n          <template v-if=\"v.is.integrations\">\n            <div style=\"display: flex; flex-direction: column; gap: 20px\">\n              <section style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px\">\n                <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                  <h2 style=\"margin: 0; font-size: 18px; font-weight: 700\">Integrasi<\/h2>\n                  <span style=\"font-size: 13px; color: #475467\">Hubungkan layanan untuk pengingat, penyimpanan dokumen, dan notifikasi.<\/span>\n                <\/div>\n                <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px\">\n                  <template v-for=\"(g, $index) in v.integrations\">\n                    <article style=\"border: 1px solid #E4E7EC; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n                      <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 12px\">\n                        <span :style=\"'width: 44px; height: 44px; border-radius: 10px; background: ' + (g.bg) + '; color: ' + (g.fg) + '; display: flex; align-items: center; justify-content: center'\">\n                          <svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path :d=\"g.icon\"><\/path><\/svg>\n                        <\/span>\n                        <span :style=\"'font-size: 12px; font-weight: 600; color: ' + (g.sfg) + '; background: ' + (g.sbg) + '; padding: 2px 8px; border-radius: 999px'\">{{ g.status }}<\/span>\n                      <\/div>\n                      <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                        <span style=\"font-size: 15px; font-weight: 700\">{{ g.name }}<\/span>\n                        <span style=\"font-size: 13px; color: #475467; line-height: 1.5\">{{ g.desc }}<\/span>\n                      <\/div>\n                      <button type=\"button\" :style=\"'align-self: flex-start; min-height: 40px; padding: 0 14px; border: ' + (g.btnBorder) + '; border-radius: 8px; background: ' + (g.btnBg) + '; color: ' + (g.btnFg) + '; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer'\">{{ g.action }}<\/button>\n                    <\/article>\n                  <\/template>\n                <\/div>\n              <\/section>\n              <section style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px\">\n                <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start\">\n                  <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                    <h2 style=\"margin: 0; font-size: 18px; font-weight: 700\">API &amp; Webhook<\/h2>\n                    <span style=\"font-size: 13px; color: #475467\">Untuk menghubungkan sistem lain, mis. bot Telegram internal.<\/span>\n                  <\/div>\n                  <button type=\"button\" style=\"min-height: 40px; padding: 0 14px; border: 1px solid #D0D5DD; border-radius: 8px; background: #FFFFFF; color: #344054; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">+ Buat API Key<\/button>\n                <\/div>\n                <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid #E4E7EC; border-radius: 10px; padding: 14px 16px\">\n                  <div style=\"display: flex; flex-direction: column; gap: 2px\">\n                    <span style=\"font-size: 14px; font-weight: 600\">Kunci produksi<\/span>\n                    <code style=\"font-size: 13px; color: #475467; font-family: ui-monospace, monospace\">ocn_live_••••••••••••••••<\/code>\n                  <\/div>\n                  <div style=\"display: flex; gap: 8px; align-items: center\">\n                    <span style=\"font-size: 12px; color: #475467\">Dipakai terakhir 20 Nov 2026<\/span>\n                    <button type=\"button\" style=\"min-height: 36px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; background: #FFFFFF; color: #B42318; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">Cabut<\/button>\n                  <\/div>\n                <\/div>\n                <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #344054\">URL webhook (pembayaran &amp; bug)\n                  <input type=\"url\" placeholder=\"https://[domain-anda]/webhooks/ocn\" style=\"min-height: 44px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-weight: 400; font-size: 14px; box-sizing: border-box\">\n                <\/label>\n              <\/section>\n            <\/div>\n          <\/template>\n        <\/div>\n      <\/div>\n\n    <\/div>\n    <\/div>\n  <\/main>\n<\/div>");
