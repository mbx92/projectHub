<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#101828;background:#F5F6F8}
a{color:#0B6E63}a:hover{color:#08544B}
table{border-collapse:collapse;width:100%}
th{font-size:12px;font-weight:600;color:#475467;text-align:left;padding:12px 16px;background:#F9FAFB;border-bottom:1px solid #E4E7EC;white-space:nowrap}
td{font-size:14px;padding:14px 16px;border-bottom:1px solid #EAECF0;vertical-align:middle;white-space:nowrap}
/* responsive:v3 */
.tb-menu{display:none}
.nav-backdrop{display:none}
@media (min-width:1024px) and (max-width:1279px){
section[aria-label^="Ringkasan"],section[aria-label="Angka utama"]{grid-template-columns:repeat(auto-fit,minmax(190px,1fr)) !important}
section[aria-label^="Ringkasan"] span[style*="font-size: 2"],section[aria-label="Angka utama"] span[style*="font-size: 2"]{font-size:20px !important}
}
@media (max-width:1023px){
.shell{flex-wrap:nowrap !important}
.side{flex:0 0 76px !important;width:76px;padding:20px 12px !important;align-items:center}
.brand-text,.nav-label{display:none !important}
.nav-link{justify-content:center;padding:0 !important;width:48px}
.content{padding:24px !important}
.topbar{padding:10px 24px !important;flex-wrap:nowrap !important}
.tb-search{flex:1 1 auto !important;min-width:0 !important}
.tb-kbd,.tb-user-text{display:none !important}
section[aria-label^="Ringkasan"],section[aria-label="Angka utama"]{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
[role="tablist"]{flex-wrap:nowrap !important;overflow-x:auto;scrollbar-width:none}
[role="tablist"]>*{flex:none}
}
@media (max-width:767px){
.shell{display:block !important}
.side{position:fixed !important;top:0;bottom:0;left:0;width:280px !important;max-width:85vw !important;z-index:60;transform:translateX(-105%);transition:transform .2s ease;overflow-y:auto;align-items:stretch;padding:24px 16px !important;box-sizing:border-box}
.side.open{transform:none;box-shadow:0 0 40px rgba(15,27,45,.35)}
.side .brand-text{display:flex !important}
.side .nav-label{display:inline !important}
.side .nav-link{justify-content:flex-start;padding:0 12px !important;width:auto}
.nav-backdrop{display:block}
.tb-menu{display:flex}
.topbar{padding:8px 12px !important;gap:8px !important;flex-wrap:nowrap !important;position:sticky;top:0;z-index:30}
.tb-search{flex:1 1 auto !important;min-width:0 !important}
.tb-help,.tb-sep,.tb-create{display:none !important}
.content{padding:16px !important}
h1{font-size:22px !important}
section[aria-label^="Ringkasan"],section[aria-label="Angka utama"],section[aria-label^="Statistik"]{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px !important}
section[aria-label^="Ringkasan"]>div,section[aria-label="Angka utama"]>div,section[aria-label^="Statistik"]>div{padding:14px !important;min-width:0}
section[aria-label^="Ringkasan"] span[style*="font-size: 2"],section[aria-label="Angka utama"] span[style*="font-size: 2"],section[aria-label^="Statistik"] span[style*="font-size: 2"]{font-size:18px !important}
th,td{padding:10px 12px !important}
.item-row{grid-template-columns:64px minmax(0,1fr) 40px !important}
.item-row>:first-child{grid-column:1/-1}
.invoice-paper{padding:20px !important}
.subnav{flex:1 1 100% !important;flex-direction:row !important;overflow-x:auto}
.subnav button{white-space:nowrap;width:auto !important}
.login-hero{padding:28px 20px !important;gap:20px !important}
.login-hero ul{display:none !important}
.login-hero h1{font-size:24px !important}
}
</style>

subtitle }}<\/p>\n        <\/div>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n          <a :href=\"v.cancelHref\" style=\"min-height: 44px; padding: 0 16px; border: 1px solid #D0D5DD; border-radius: 8px; background: #FFFFFF; color: #344054; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center\">Batal<\/a>\n          <a href=\"ProjectDetail.html\" style=\"min-height: 44px; padding: 0 18px; border-radius: 8px; background: #0B6E63; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center\">{{ v.saveLabel }}<\/a>\n        <\/div>\n      <\/header>\n\n      <div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start\">\n        <div style=\"flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n\n          <!-- Informasi dasar -->\n          <section style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px\">\n            <div style=\"display: flex; flex-direction: column; gap: 4px\">\n              <h2 style=\"margin: 0; font-size: 16px; font-weight: 700\">Informasi Dasar<\/h2>\n              <span style=\"font-size: 13px; color: #475467\">Nama, klien, dan jadwal proyek.<\/span>\n            <\/div>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #344054\">Nama proyek <span style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">wajib<\/span>\n              <input type=\"text\" :value=\"v.v.name\" placeholder=\"Mis. Sistem Kasir Toko [Nama]\" style=\"min-height: 44px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-weight: 400; font-size: 14px; box-sizing: border-box\">\n            <\/label>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px\">\n              <ui-search-select label=\"Klien\" :options=\"v.clientOpts\" :value=\"v.v.clientVal\" placeholder=\"Pilih klien…\" search-placeholder=\"Cari klien…\" footer=\"+ Tambah klien baru\" />\n              <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #344054\">Kontak klien\n                <input type=\"text\" :value=\"v.v.contact\" placeholder=\"Nama &amp; nomor WhatsApp PIC klien\" style=\"min-height: 44px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-weight: 400; font-size: 14px; box-sizing: border-box\">\n              <\/label>\n              <ui-select label=\"Status\" options=\"Persiapan|Berjalan|Tertunda|Selesai\" :value=\"v.v.status\" />\n              <ui-select label=\"Penanggung jawab\" options=\"Pande|Angga\" value=\"Pande\" />\n              <ui-date label=\"Tanggal mulai\" mode=\"date\" :value=\"v.v.start\" />\n              <ui-date label=\"Target selesai\" mode=\"date\" :value=\"v.v.end\" />\n            <\/div>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #344054\">Deskripsi &amp; ruang lingkup\n              <textarea rows=\"3\" placeholder=\"Modul yang dikerjakan, platform, batasan…\" style=\"padding: 12px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-weight: 400; font-size: 14px; resize: vertical; box-sizing: border-box\" :value=\"v.v.desc\"><\/textarea>\n            <\/label>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #344054\">Stack / teknologi\n              <input type=\"text\" :value=\"v.v.stack\" placeholder=\"Mis. Nuxt, PostgreSQL, Flutter\" style=\"min-height: 44px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-weight: 400; font-size: 14px; box-sizing: border-box\">\n            <\/label>\n          <\/section>\n\n          <!-- Nilai & termin -->\n          <section style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px\">\n            <div style=\"display: flex; flex-direction: column; gap: 4px\">\n              <h2 style=\"margin: 0; font-size: 16px; font-weight: 700\">Nilai Kontrak &amp; Termin<\/h2>\n              <span style=\"font-size: 13px; color: #475467\">Termin otomatis menjadi jadwal tagihan &amp; invoice.<\/span>\n            <\/div>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px\">\n              <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #344054\">Nilai kontrak (Rp)\n                <input type=\"text\" inputmode=\"numeric\" :value=\"v.valueText\" @input=\"v.onValue\" style=\"min-height: 44px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-weight: 600; font-size: 14px; box-sizing: border-box\">\n              <\/label>\n              <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #344054\">Anggaran biaya (Rp)\n                <input type=\"text\" inputmode=\"numeric\" :value=\"v.v.budget\" placeholder=\"0\" style=\"min-height: 44px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-weight: 400; font-size: 14px; box-sizing: border-box\">\n              <\/label>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: 10px\">\n              <template v-for=\"(t, $index) in v.terms\">\n                <div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; padding: 12px; border: 1px solid #E4E7EC; border-radius: 10px\">\n                  <label style=\"flex: 1 1 120px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: #475467\">Termin\n                    <input type=\"text\" :value=\"t.name\" @input=\"t.onName\" style=\"min-height: 40px; padding: 0 10px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-weight: 400; font-size: 14px; color: #101828; box-sizing: border-box; width: 100%\">\n                  <\/label>\n                  <label style=\"flex: 0 0 88px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: #475467\">Persen (%)\n                    <input type=\"number\" min=\"0\" max=\"100\" :value=\"t.pct\" @input=\"t.onPct\" style=\"min-height: 40px; padding: 0 10px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-weight: 400; font-size: 14px; color: #101828; box-sizing: border-box; width: 100%\">\n                  <\/label>\n                  <div style=\"flex: 1 1 130px; display: flex; flex-direction: column; gap: 4px\">\n                    <span style=\"font-size: 12px; font-weight: 600; color: #475467\">Nominal<\/span>\n                    <span style=\"min-height: 40px; display: flex; align-items: center; font-size: 14px; font-weight: 700\">{{ t.amount }}<\/span>\n                  <\/div>\n                  <label style=\"flex: 2 1 200px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: #475467\">Syarat penagihan\n                    <input type=\"text\" :value=\"t.cond\" style=\"min-height: 40px; padding: 0 10px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-weight: 400; font-size: 14px; color: #101828; box-sizing: border-box; width: 100%\">\n                  <\/label>\n                  <div style=\"flex: 1 1 180px; min-width: 170px; display: flex; flex-direction: column; gap: 4px\">\n                    <span style=\"font-size: 12px; font-weight: 600; color: #475467\">Jatuh tempo<\/span>\n                    <ui-date label=\"\" aria-label=\"Jatuh tempo termin\" mode=\"date\" :value=\"t.due\" size=\"sm\" />\n                  <\/div>\n                  <button type=\"button\" aria-label=\"Hapus termin\" @click=\"t.remove\" style=\"width: 40px; height: 40px; border: none; border-radius: 8px; background: transparent; color: #B42318; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3\"><\/path><\/svg><\/button>\n                <\/div>\n              <\/template>\n            <\/div>\n            <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px\">\n              <button type=\"button\" @click=\"v.addTerm\" style=\"min-height: 40px; padding: 0 14px; border: 1px dashed #0B6E63; border-radius: 8px; background: #FFFFFF; color: #08544B; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">+ Tambah termin<\/button>\n              <span role=\"status\" :style=\"'font-size: 13px; font-weight: 600; color: ' + (v.pctColor) + '; background: ' + (v.pctBg) + '; padding: 6px 12px; border-radius: 8px'\">{{ v.pctText }}<\/span>\n            <\/div>\n          <\/section>\n\n          <!-- Tim & skema -->\n          <section style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px\">\n            <div style=\"display: flex; flex-direction: column; gap: 4px\">\n              <h2 style=\"margin: 0; font-size: 16px; font-weight: 700\">Tim &amp; Skema Bagi Hasil<\/h2>\n              <span style=\"font-size: 13px; color: #475467\">Pilih template dari Pengaturan, lalu sesuaikan bila perlu.<\/span>\n            <\/div>\n            <div role=\"radiogroup\" aria-label=\"Skema bagi hasil\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px\">\n              <template v-for=\"(s, $index) in v.schemes\">\n                <button type=\"button\" role=\"radio\" :aria-checked=\"s.on\" @click=\"s.pick\" :style=\"'text-align: left; border: ' + (s.border) + '; border-radius: 10px; padding: 14px; background: ' + (s.bg) + '; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px'\">\n                  <span style=\"font-size: 14px; font-weight: 700; color: #101828\">{{ s.name }}<\/span>\n                  <span style=\"font-size: 12px; color: #475467\">{{ s.desc }}<\/span>\n                <\/button>\n              <\/template>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: 10px\">\n              <template v-for=\"(m, $index) in v.team\">\n                <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px; border: 1px solid #E4E7EC; border-radius: 10px\">\n                  <div style=\"flex: 1 1 150px; display: flex; align-items: center; gap: 10px\"><span :style=\"'width: 32px; height: 32px; border-radius: 999px; background: ' + (m.bg) + '; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex: none'\">{{ m.ini }}<\/span><span style=\"font-weight: 600; font-size: 14px\">{{ m.name }}<\/span><\/div>\n                  <input type=\"text\" aria-label=\"Peran di proyek\" :value=\"m.role\" placeholder=\"Peran di proyek\" style=\"flex: 2 1 220px; min-height: 40px; padding: 0 10px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-size: 14px; box-sizing: border-box\">\n                  <div style=\"flex: 1 1 220px; min-width: 200px\"><ui-select label=\"\" aria-label=\"Cara pembayaran\" options=\"Bagi hasil|Dibayar tetap (biaya proyek)\" :value=\"m.pay\" size=\"sm\" /><\/div>\n                  <button type=\"button\" aria-label=\"Keluarkan dari tim\" @click=\"m.remove\" style=\"width: 40px; height: 40px; border: none; border-radius: 8px; background: transparent; color: #B42318; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"><\/path><\/svg><\/button>\n                <\/div>\n              <\/template>\n            <\/div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n              <template v-for=\"(a, $index) in v.addable\">\n                <button type=\"button\" @click=\"a.add\" style=\"min-height: 40px; padding: 0 14px; border: 1px dashed #0B6E63; border-radius: 8px; background: #FFFFFF; color: #08544B; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">+ {{ a.name }}<\/button>\n              <\/template>\n            <\/div>\n          <\/section>\n\n          <!-- Milestone -->\n          <section style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px\">\n            <div style=\"display: flex; flex-direction: column; gap: 4px\">\n              <h2 style=\"margin: 0; font-size: 16px; font-weight: 700\">Milestone<\/h2>\n              <span style=\"font-size: 13px; color: #475467\">Tahapan pekerjaan yang tampil di tab Ringkasan.<\/span>\n            <\/div>\n            <template v-for=\"(m, $index) in v.milestones\">\n              <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px\">\n                <span style=\"width: 28px; height: 28px; border-radius: 999px; background: #F2F4F7; color: #344054; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none\">{{ m.no }}<\/span>\n                <input type=\"text\" aria-label=\"Nama milestone\" :value=\"m.name\" @input=\"m.onName\" placeholder=\"Nama tahapan\" style=\"flex: 1 1 240px; min-height: 40px; padding: 0 10px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-size: 14px; box-sizing: border-box\">\n                <div style=\"flex: 0 1 190px; min-width: 170px\"><ui-date label=\"\" aria-label=\"Target milestone\" mode=\"date\" :value=\"m.due\" size=\"sm\" /><\/div>\n                <button type=\"button\" aria-label=\"Hapus milestone\" @click=\"m.remove\" style=\"width: 36px; height: 36px; border: none; border-radius: 8px; background: transparent; color: #B42318; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"><\/path><\/svg><\/button>\n              <\/div>\n            <\/template>\n            <button type=\"button\" @click=\"v.addMilestone\" style=\"align-self: flex-start; min-height: 40px; padding: 0 14px; border: 1px dashed #0B6E63; border-radius: 8px; background: #FFFFFF; color: #08544B; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">+ Tambah milestone<\/button>\n          <\/section>\n\n          <template v-if=\"v.isEdit\">\n            <section style=\"background: #FFFFFF; border: 1px solid #FECDCA; border-radius: 12px; padding: 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px; max-width: 560px\">\n                <h2 style=\"margin: 0; font-size: 16px; font-weight: 700; color: #B42318\">Zona Berbahaya<\/h2>\n                <span style=\"font-size: 13px; color: #475467\">Arsipkan untuk menyembunyikan proyek tanpa menghapus data. Hapus permanen akan menghapus termin, pengeluaran, bug, dan dokumen.<\/span>\n              <\/div>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n                <button type=\"button\" style=\"min-height: 44px; padding: 0 16px; border: 1px solid #D0D5DD; border-radius: 8px; background: #FFFFFF; color: #344054; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer\">Arsipkan<\/button>\n                <button type=\"button\" @click=\"v.openDelete\" style=\"min-height: 44px; padding: 0 16px; border: none; border-radius: 8px; background: #D92D20; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer\">Hapus proyek<\/button>\n              <\/div>\n            <\/section>\n          <\/template>\n        <\/div>\n\n        <aside style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n          <section style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n            <h2 style=\"margin: 0; font-size: 16px; font-weight: 700\">Ringkasan<\/h2>\n            <div style=\"display: flex; justify-content: space-between; font-size: 13px\"><span style=\"color: #475467\">Nilai kontrak<\/span><span style=\"font-weight: 700\">{{ v.valueRp }}<\/span><\/div>\n            <div style=\"display: flex; justify-content: space-between; font-size: 13px\"><span style=\"color: #475467\">Jumlah termin<\/span><span style=\"font-weight: 600\">{{ v.termCount }}<\/span><\/div>\n            <div style=\"display: flex; justify-content: space-between; font-size: 13px\"><span style=\"color: #475467\">Total persen termin<\/span><span :style=\"'font-weight: 600; color: ' + (v.pctColor)\">{{ v.pctSum }}%<\/span><\/div>\n            <div style=\"display: flex; justify-content: space-between; font-size: 13px\"><span style=\"color: #475467\">Anggota tim<\/span><span style=\"font-weight: 600\">{{ v.teamCount }} orang<\/span><\/div>\n            <div style=\"display: flex; justify-content: space-between; font-size: 13px\"><span style=\"color: #475467\">Skema<\/span><span style=\"font-weight: 600\">{{ v.schemeName }}<\/span><\/div>\n            <div style=\"display: flex; justify-content: space-between; font-size: 13px\"><span style=\"color: #475467\">Milestone<\/span><span style=\"font-weight: 600\">{{ v.msCount }}<\/span><\/div>\n          <\/section>\n          <section style=\"background: #F3FAF8; border: 1px solid #CCE9E3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 8px\">\n            <span style=\"font-size: 14px; font-weight: 700; color: #08544B\">Setelah disimpan<\/span>\n            <ul style=\"margin: 0; padding-left: 18px; font-size: 13px; color: #344054; line-height: 1.7\">\n              <li>Termin dibuat sebagai jadwal tagihan<\/li>\n              <li>Invoice DP bisa langsung diterbitkan<\/li>\n              <li>Anggota tim mendapat akses proyek &amp; bug<\/li>\n            <\/ul>\n          <\/section>\n        <\/aside>\n      <\/div>\n\n      <template v-if=\"v.delOpen\">\n        <div style=\"position: fixed; inset: 0; z-index: 50; background: rgba(15,27,45,0.6); display: flex; align-items: center; justify-content: center; padding: 16px\">\n          <button type=\"button\" aria-label=\"Tutup dialog\" @click=\"v.closeDelete\" style=\"position: absolute; inset: 0; border: none; background: transparent; cursor: default\"><\/button>\n          <div role=\"alertdialog\" aria-modal=\"true\" aria-labelledby=\"del-title\" style=\"position: relative; width: 100%; max-width: 448px; background: #FFFFFF; border-radius: 16px; padding: 24px; box-shadow: 0 24px 48px rgba(16,24,40,0.24); display: flex; flex-direction: column; gap: 20px\">\n            <div style=\"display: flex; gap: 16px\">\n              <span style=\"width: 44px; height: 44px; flex: none; border-radius: 999px; background: #FEE4E2; color: #B42318; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3\"><\/path><\/svg><\/span>\n              <div style=\"display: flex; flex-direction: column; gap: 6px; padding-top: 2px\">\n                <h2 id=\"del-title\" style=\"margin: 0; font-size: 18px; font-weight: 700\">Hapus proyek ini?<\/h2>\n                <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #475467\">3 termin, 4 pengeluaran, 10 bug, dan 7 dokumen ikut terhapus. Tindakan ini tidak bisa dibatalkan.<\/p>\n              <\/div>\n            <\/div>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #344054\">\n              <span>Ketik <code style=\"background: #F2F4F7; border-radius: 4px; padding: 2px 6px; font-size: 12px; color: #101828\">Sistem Informasi BUMDes<\/code> untuk konfirmasi<\/span>\n              <input type=\"text\" :value=\"v.typed\" @input=\"v.onTyped\" autocomplete=\"off\" v-focus style=\"min-height: 44px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-weight: 400; font-size: 14px; box-sizing: border-box\">\n            <\/label>\n            <div style=\"display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px\">\n              <button type=\"button\" @click=\"v.closeDelete\" style=\"min-height: 44px; padding: 0 16px; border: 1px solid #D0D5DD; border-radius: 8px; background: #FFFFFF; color: #344054; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer\">Batal<\/button>\n              <template v-if=\"v.canDelete\">\n                <a href=\"Projects.html\" style=\"min-height: 44px; padding: 0 16px; border-radius: 8px; background: #D92D20; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center\">Hapus proyek<\/a>\n              <\/template>\n              <template v-if=\"v.cannotDelete\">\n                <button type=\"button\" disabled style=\"min-height: 44px; padding: 0 16px; border: none; border-radius: 8px; background: #D92D20; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; opacity: 0.5; cursor: not-allowed\">Hapus proyek<\/button>\n              <\/template>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/template>\n\n    <\/div>\n    <\/div>\n  <\/main>\n<\/div>");
</script>
