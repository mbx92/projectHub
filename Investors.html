t-size: 15px; font-weight: 700\">{{ v.capital }}<\/span><\/div>\n              <div style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 12px; color: #475467\">Porsi modal<\/span><span style=\"font-size: 15px; font-weight: 700\">{{ v.share }}<\/span><\/div>\n              <div style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 12px; color: #475467\">Bagi hasil diterima<\/span><span style=\"font-size: 15px; font-weight: 700; color: #067647\">{{ v.payout }}<\/span><\/div>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: 6px\">\n              <div style=\"display: flex; justify-content: space-between; font-size: 12px; color: #475467\"><span>Porsi dari total modal<\/span><span>{{ v.share }}<\/span><\/div>\n              <div style=\"height: 8px; border-radius: 999px; background: #EAECF0; overflow: hidden\"><div :style=\"'width: ' + (v.pct) + '%; height: 100%; background: ' + (v.avatar)\"><\/div><\/div>\n            <\/div>\n            <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid #EAECF0; padding-top: 12px\">\n              <span style=\"font-size: 12px; color: #475467\">{{ v.note }}<\/span>\n              <a href=\"Main.html\" style=\"font-size: 13px; font-weight: 600; text-decoration: none; min-height: 44px; display: flex; align-items: center\">Lihat dashboard-nya<\/a>\n            <\/div>\n          <\/article>\n        <\/template>\n      <\/section>\n\n      <div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start\">\n        <section style=\"flex: 1 1 440px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; overflow: hidden\">\n          <h2 style=\"margin: 0; padding: 20px; font-size: 16px; font-weight: 700\">Riwayat Setoran Modal<\/h2>\n          <div style=\"overflow-x: auto\">\n            <table>\n              <thead><tr><th scope=\"col\">Tanggal<\/th><th scope=\"col\">Investor<\/th><th scope=\"col\">Nominal<\/th><th scope=\"col\">Peruntukan<\/th><th scope=\"col\">Bukti<\/th><\/tr><\/thead>\n              <tbody>\n                <template v-for=\"(d, $index) in v.deposits\">\n                  <tr><td>{{ d.date }}<\/td><td style=\"font-weight: 600\">{{ d.who }}<\/td><td style=\"font-weight: 600\">{{ d.amount }}<\/td><td>{{ d.purpose }}<\/td><td><a href=\"#\" style=\"font-size: 13px; font-weight: 600; text-decoration: none\">Lihat<\/a><\/td><\/tr>\n                <\/template>\n              <\/tbody>\n            <\/table>\n          <\/div>\n        <\/section>\n\n        <section style=\"flex: 1 1 440px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; overflow: hidden\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 20px\">\n            <h2 style=\"margin: 0; font-size: 16px; font-weight: 700\">Distribusi Bagi Hasil<\/h2>\n            <button type=\"button\" style=\"min-height: 36px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; background: #FFFFFF; color: #344054; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">+ Distribusi Baru<\/button>\n          <\/div>\n          <div style=\"overflow-x: auto\">\n            <table>\n              <thead><tr><th scope=\"col\">Proyek<\/th><th scope=\"col\">Laba Bersih<\/th><th scope=\"col\">Modal 40%<\/th><th scope=\"col\">Pekerja 40%<\/th><th scope=\"col\">Kas 20%<\/th><\/tr><\/thead>\n              <tbody>\n                <template v-for=\"(p, $index) in v.payouts\">\n                  <tr>\n                    <td><div style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-weight: 600\">{{ p.project }}<\/span><span style=\"font-size: 12px; color: #475467\">{{ p.date }}<\/span><\/div><\/td>\n                    <td style=\"font-weight: 600\">{{ p.profit }}<\/td>\n                    <td style=\"color: #067647; font-weight: 600\">{{ p.inv }}<\/td>\n                    <td>{{ p.work }}<\/td>\n                    <td>{{ p.kas }}<\/td>\n                  <\/tr>\n                <\/template>\n              <\/tbody>\n            <\/table>\n          <\/div>\n        <\/section>\n      <\/div>\n\n    <\/div>\n    <\/div>\n  <\/main>\n<\/div>");
